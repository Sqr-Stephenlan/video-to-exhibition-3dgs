name: CPU checks

"on":
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-sanity:
    name: Repository sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tracked project contract
        shell: bash
        run: |
          set -euo pipefail
          for path in AGENTS.md dev.sh docs scripts data outputs tests/unit tests/integration tests/gpu; do
            test -e "$path"
          done
          bash -n dev.sh

      - name: Report project environment
        shell: bash
        run: ./dev.sh doctor

      - name: Validate GitHub collaboration files
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/CODEOWNERS
          test -f .github/pull_request_template.md
          test -f .github/ISSUE_TEMPLATE/gpu-test-request.yml
          test -f docs/collaborator_agent_development_guide.md

  python-cpu:
    name: Python CPU checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - id: project
        name: Detect Python project metadata and tests
        shell: bash
        run: |
          set -euo pipefail
          metadata_found=false
          for path in pyproject.toml requirements.txt; do
            if [ -f "$path" ]; then
              metadata_found=true
              break
            fi
          done

          tests_found=false
          for test_dir in tests/unit tests/integration; do
            if find "$test_dir" -type f -name 'test_*.py' -print -quit | grep -q .; then
              tests_found=true
              break
            fi
          done

          echo "metadata_found=$metadata_found" >> "$GITHUB_OUTPUT"
          echo "tests_found=$tests_found" >> "$GITHUB_OUTPUT"

      - name: Bootstrap declared Python environment
        if: steps.project.outputs.metadata_found == 'true'
        shell: bash
        run: ./dev.sh bootstrap

      - name: Materialize locked remote LongSplat distribution
        if: steps.project.outputs.metadata_found == 'true'
        shell: bash
        run: ./dev.sh python -m scripts.longsplat.verify_remote_distribution --root "$GITHUB_WORKSPACE" --json

      - name: Require dependency metadata for discovered tests
        if: steps.project.outputs.tests_found == 'true' && steps.project.outputs.metadata_found != 'true'
        shell: bash
        run: |
          echo "::error::Python tests exist, but no supported dependency manifest was found."
          exit 1

      - name: Run Ruff when configured
        if: steps.project.outputs.metadata_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .ruff.toml ] || [ -f ruff.toml ] || { [ -f pyproject.toml ] && grep -q '^\[tool\.ruff\]' pyproject.toml; }; then
            ./dev.sh python -c "import ruff"
            ./dev.sh ruff check .
          else
            echo "No Ruff configuration declared; skipping Ruff."
          fi

      - name: Run discovered CPU tests
        if: steps.project.outputs.tests_found == 'true' && steps.project.outputs.metadata_found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./dev.sh python -c "import pytest"
          ./dev.sh pytest tests/unit tests/integration

      - name: Report intentionally empty Python test surface
        if: steps.project.outputs.tests_found != 'true'
        shell: bash
        run: echo "No CPU test_*.py files are currently present in tests/unit or tests/integration; execution is intentionally skipped."
